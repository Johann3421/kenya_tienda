version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenya_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-kenya_tienda}
      - DB_USERNAME=${DB_USERNAME:-kenya_app}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - APP_NAME=${APP_NAME:-"Kenya Tienda"}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - LOG_CHANNEL=stderr
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app/public

  db:
    image: postgres:15-alpine
    container_name: kenya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kenya_tienda}
      POSTGRES_USER: ${DB_USERNAME:-kenya_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
    # NO exponer públicamente — la app se conecta via red interna Docker
    # ports:
    #   - "5432:5432"
    volumes:
      - db_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data_v2:
  app_storage:
